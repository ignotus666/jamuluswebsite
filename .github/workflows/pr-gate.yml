name: PR Gate Check
on:
  pull_request:
    branches: [next-release]
    types: [opened, labeled, unlabeled, synchronize]

jobs:
  weblate-check:
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    steps:
      - name: Check for Weblate PR label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const hasWeblateLabel = labels.some(label => label.name === 'Check for Weblate PR');
            
            if (hasWeblateLabel) {
              core.setFailed('Cannot merge: Verify that there are no Weblate PRs. If none, remove the "Check for Weblate PR" label.');
            } else {
              console.log('No "Check for Weblate PR" label found. PR can proceed to merge.');
            }